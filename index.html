<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lie or Nah?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e6ff;--ink:#1b1740;--card:#fff;--soft:#d8d3ff;--lie:#ff3d7f;--truth:#0f9d8a;--mut:#5a5680;--gold:#ffb703;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14112e;--ink:#f1efff;--card:#221d4a;--soft:#342d6b;--lie:#ff6b9d;--truth:#2fd1b9;--mut:#a7a2d4}}
:root[data-theme="dark"]{--bg:#14112e;--ink:#f1efff;--card:#221d4a;--soft:#342d6b;--lie:#ff6b9d;--truth:#2fd1b9;--mut:#a7a2d4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;line-height:1.45;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(2.6rem,12vw,4rem);line-height:.92;margin:.1em 0 .25em;font-weight:800;letter-spacing:-.035em}
h2{font-size:1.7rem;margin:.2em 0;font-weight:800;letter-spacing:-.02em}
p{margin:.4em 0}.mut{color:var(--mut)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;font-weight:600;color:var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.go{background:var(--ink);color:var(--bg);width:100%;margin-top:12px;font-size:1.05rem}
.daily{background:var(--gold);color:#2b1c00}
.cast{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0 4px}
.cast div{text-align:center;font-size:.72rem;font-weight:600}
.cast svg{width:100%;height:auto;border-radius:50%;background:var(--soft);display:block;margin-bottom:2px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.95rem}
.badge{background:var(--ink);color:var(--bg);border-radius:99px;padding:4px 12px;font-size:.85rem}
.badge.d{background:var(--gold);color:#2b1c00}
.hearts{letter-spacing:2px;color:var(--lie)}.hearts i{font-style:normal;opacity:.2}
.card{background:var(--card);border-radius:24px;padding:18px;margin-top:12px}
.stage{display:flex;gap:14px;align-items:center}
.stage .face{flex:0 0 112px;width:112px;height:112px;border-radius:50%;background:var(--soft);border:5px solid var(--soft);overflow:hidden;transition:border-color .3s,transform .3s}
.face svg{width:100%;height:100%;display:block}
.face.l{border-color:var(--lie);transform:rotate(-6deg) scale(1.05)}.face.t{border-color:var(--truth);transform:scale(1.05)}
.nm{font-weight:800;font-size:1.3rem;line-height:1.1}.rl{color:var(--mut);font-size:.85rem}
.setup{color:var(--mut);font-size:.95rem;margin:14px 0 0}
.bub{position:relative;background:var(--soft);border-radius:20px;padding:14px 16px;margin:14px 0 6px;font-size:1.2rem;font-weight:600}
.bub::before{content:"";position:absolute;top:-9px;left:36px;border:10px solid transparent;border-top:0;border-bottom-color:var(--soft)}
ul.clues{list-style:none;padding:0;margin:10px 0 0}
ul.clues li{border-left:4px solid var(--ink);padding:5px 0 5px 12px;margin:8px 0;transition:opacity .3s}
li.hl{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,transparent)}
li.dim{opacity:.4;text-decoration:line-through}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:99px;padding:1px 8px;margin-left:6px;background:var(--soft)}
.tag.fact{background:var(--gold);color:#2b1c00}
.hints{display:flex;gap:8px;margin-top:12px}
.hints button{flex:1;background:var(--soft);font-size:.8rem;padding:10px 8px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pick button{padding:18px 8px;font-size:1.25rem;font-weight:800}
.t{background:var(--truth);color:#06251f}.l{background:var(--lie);color:#2b0013}
.reveal{margin-top:14px;padding:14px;border-radius:16px;background:var(--soft)}
.reveal b.ok{color:var(--truth)}.reveal b.no{color:var(--lie)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.stats div{background:var(--card);border-radius:16px;padding:12px;font-size:.85rem}
.stats strong{display:block;font-size:1.6rem}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>Lie or Nah?</h1>
  <p>Someone you know says they didn’t take your stuff. Read the clues, trust the facts over the vibes, and call it. The cases never run out.</p>
  <button class="go" id="endless">Play endless</button>
  <button class="go daily" id="dly">Daily case</button>
  <p class="mut" id="best"></p>
  <div class="cast" id="cast"></div>
  <p class="mut" style="font-size:.85rem">Every character and scenario is made up.</p>
</section>

<section id="play" class="hide" aria-live="polite">
  <div class="top"><span class="badge" id="lvl"></span><span class="hearts" id="hearts"></span><span id="score"></span></div>
  <div class="card">
    <div class="stage"><div class="face" id="face"></div><div><div class="nm" id="name"></div><div class="rl" id="role"></div></div></div>
    <p class="setup" id="setup"></p>
    <div class="bub" id="claim"></div>
    <ul class="clues" id="clues"></ul>
    <div class="hints" id="hints">
      <button id="h1"></button><button id="h2"></button>
    </div>
    <div class="pick" id="pick">
      <button class="t" data-a="1">Truth</button>
      <button class="l" data-a="0">Lie</button>
    </div>
    <div class="reveal hide" id="reveal"></div>
    <button class="go hide" id="next">Next</button>
  </div>
</section>

<section id="end" class="hide">
  <h2 id="rank"></h2>
  <p id="verdict"></p>
  <div class="stats"><div><strong id="fs"></strong>points</div><div><strong id="fc"></strong>correct</div><div><strong id="fb"></strong>best streak</div></div>
  <button class="go daily hide" id="share">Copy result</button>
  <button class="go" id="menu">Back to menu</button>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const CAST=[
{n:"Pixie",role:"little sister",sk:"#f6d2b5",hr:"#ff4f8b",hs:1,sh:"#7c5cff",ac:"e"},
{n:"Dex",role:"big brother",sk:"#8d5a3b",hr:"#1b1740",hs:0,sh:"#ff9f1c",ac:"h"},
{n:"Marlo",role:"mom",sk:"#e0ac86",hr:"#5a2d0c",hs:1,sh:"#12a594",ac:"e"},
{n:"Gus",role:"dad",sk:"#f1c9a5",hr:"#6b6b7a",hs:0,sh:"#3d5afe",ac:"g"},
{n:"Zed",role:"cousin",sk:"#c68642",hr:"#111",hs:2,sh:"#ff3d7f",ac:"c"},
{n:"Juno",role:"best friend",sk:"#fbe0c8",hr:"#ffb703",hs:1,sh:"#fb5607",ac:"g"},
{n:"Kai",role:"roommate",sk:"#a9714b",hr:"#2b2b2b",hs:3,sh:"#06d6a0",ac:"h"},
{n:"Ray",role:"uncle",sk:"#d9a07a",hr:"#cfcfcf",hs:3,sh:"#8338ec",ac:"g"},
{n:"Nana Pea",role:"grandma",sk:"#f3d5bd",hr:"#e5e5ee",hs:4,sh:"#ef476f",ac:"e"},
{n:"Bo",role:"classmate",sk:"#7a4a2a",hr:"#222",hs:2,sh:"#ffd166",ac:"c"}];
const ITEMS=["fragrance","AirPods","phone","TV remote","Stanley cup","sneakers","hoodie","game controller","lip gloss","Labubu"];
const FL=["A friend’s photo from last night shows your {it} on their bed","Your {it} turns up at the bottom of their bag","Find My puts your {it} at their address","Their chat from Tuesday talks about “borrowing” your {it}","They said they were out, but a timestamp shows them home with your {it}"];
const FT=["Find My shows your {it} was at your place all day","A timestamped chat backs up exactly where they were","Your {it} turns up inside your own jacket pocket","They show a receipt for their own {it}, dated before yours vanished","Their own {it} has a different serial number than yours"];
const BL=["Over-explains with tiny, specific details","Answers before you finish asking","Repeats your question back to you","Suddenly changes the subject","Gets oddly casual and jokey","Sweating and fidgeting","Won’t look you in the eye","Voice gets higher"];
const BT=["Calm, steady eye contact","Offers to show proof","A little annoyed you asked","Gives a short, direct answer","Admits a small unrelated thing up front","Tells the same story as the first time","Seems genuinely confused"];
const NO=["They’re wearing a brand-new hoodie","The TV is on in the background","Their phone case is pastel pink","It’s raining outside"];
const CL=[it=>"“I never touched your "+it+".”",it=>"“I swear I don’t have your "+it+".”",it=>"“I already gave your "+it+" back.”",it=>"“Why would I take your "+it+"? Come on.”"];
const LV=["","Easy","Sneaky","Tricky","Expert","Mastermind","Daily case"];

function avatar(c,m){
  const o=`stroke="#1b1740" stroke-width="3" stroke-linecap="round" fill="none"`;
  let back="",front="",ac="",brow="",mouth=`<path d="M50 80Q60 84 70 80" ${o}/>`,extra="";
  if(c.hs==1)back=`<path d="M20 62Q16 10 60 10Q104 10 100 62L102 104L18 104Z" fill="${c.hr}"/>`;
  if(c.hs==2)back=`<circle cx="60" cy="32" r="30" fill="${c.hr}"/>`;
  if(c.hs==4)back=`<circle cx="60" cy="20" r="13" fill="${c.hr}"/>`;
  if(c.hs!=3&&c.hs!=2)front=`<path d="M27 58Q24 22 60 22Q96 22 93 58Q84 40 60 40Q36 40 27 58Z" fill="${c.hr}"/>`;
  if(c.ac=="g")ac=`<g stroke="#1b1740" stroke-width="2.5" fill="none"><circle cx="47" cy="62" r="9"/><circle cx="73" cy="62" r="9"/><path d="M56 62h8"/></g>`;
  if(c.ac=="h")ac=`<path d="M26 62Q26 22 60 22Q94 22 94 62" stroke="#222" stroke-width="5" fill="none"/><rect x="21" y="56" width="10" height="18" rx="4" fill="#222"/><rect x="89" y="56" width="10" height="18" rx="4" fill="#222"/>`;
  if(c.ac=="e")ac=`<circle cx="28" cy="76" r="3.5" fill="#ffb703"/><circle cx="92" cy="76" r="3.5" fill="#ffb703"/>`;
  if(c.ac=="c")ac=`<path d="M26 46Q28 16 60 16Q92 16 94 46Z" fill="#222"/><rect x="22" y="44" width="76" height="6" rx="3" fill="#222"/>`;
  if(m=="l"){brow=`<path d="M38 50L55 55M82 50L65 55" ${o}/>`;mouth=`<path d="M48 79Q64 92 77 73" ${o}/>`;extra=`<path d="M92 48Q96 56 92 60Q88 56 92 48Z" fill="#4cc9f0"/>`}
  if(m=="t"){brow=`<path d="M39 52Q47 46 55 52M65 52Q73 46 81 52" ${o}/>`;mouth=`<path d="M47 77Q60 90 73 77" ${o}/>`}
  return `<svg viewBox="0 0 120 120" role="img" aria-label="${c.n}">${back}<path d="M12 124Q16 94 60 94Q104 94 108 124Z" fill="${c.sh}"/><rect x="52" y="88" width="16" height="14" fill="${c.sk}"/><circle cx="60" cy="62" r="32" fill="${c.sk}"/>${front}<circle cx="47" cy="63" r="3.5" fill="#1b1740"/><circle cx="73" cy="63" r="3.5" fill="#1b1740"/>${brow}${mouth}${ac}${extra}</svg>`;
}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(d,r){
  const P=a=>a[Math.floor(r()*a.length)],S=a=>a.map(x=>[r(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
  const c=P(CAST),it=P(ITEMS),lie=r()<.5,f=s=>s.replace(/{it}/g,it);
  const fact=f(P(lie?FL:FT));
  const sup=S(lie?BL:BT).slice(0,[0,2,1,1,0,0,0][d]);
  const her=S(lie?BT:BL).slice(0,[0,0,1,2,2,3,4][d]);
  const noise=d>=4?[P(NO)]:[];
  let cl=S([{t:fact,k:"fact"},...sup.map(t=>({t,k:"sup"})),...her.map(t=>({t,k:"her"})),...noise.map(t=>({t,k:"noise"}))]);
  if(d==6){const fs=S(lie?FL:FT).slice(0,2).map(f),ns=S(NO),bs=S(lie?BL:BT);cl=[{t:ns[0],k:"noise"},{t:ns[1],k:"noise"},{t:bs[0],k:"sup"},{t:fs[0],k:"fact"},{t:bs[1],k:"sup"},{t:fs[1],k:"fact"}]}
  return {c,d,lie,fact,cl,a:lie?0:1,setup:"Your "+it+" has gone missing. You ask your "+c.role+", "+c.n+".",claim:P(CL)(it),
    why:(lie?"Caught. ":"They’re honest. ")+"The solid clue: “"+fact+".” Behavior can fool you"+(her.length?" (don’t be swayed by: "+her.join("; ").toLowerCase()+")":"")+"."};
}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const COST={endless:[5,10],daily:[20,30]};
let G;
function show(id){["home","play","end"].forEach(s=>$(s).classList.toggle("hide",s!==id))}
function home(){
  show("home");
  $("cast").innerHTML=CAST.map(c=>"<div>"+avatar(c)+c.n+"</div>").join("");
  const b=store.get("lon_best");$("best").textContent=b?"Your endless best: "+b+" points":"";
  let dd=null;try{dd=JSON.parse(store.get("lon_daily"))}catch(e){}
  $("dly").textContent=dd&&dd.date===today()?"Daily case: done ("+dd.score+"/100)":"Daily case: super hard";
}
function start(mode){
  G={mode,lives:mode=="daily"?1:3,score:mode=="daily"?100:0,streak:0,best:0,round:0,right:0,total:0};
  if(mode=="daily"){const s=today().split("-").join("");G.q=gen(6,rng(+s))}else G.q=gen(1,Math.random);
  show("play");render();
}
function render(){
  const q=G.q,m=G.mode;G.answered=false;G.h=[false,false];
  $("lvl").textContent=m=="daily"?"Daily case":"Level "+q.d+": "+LV[q.d];$("lvl").className="badge"+(m=="daily"?" d":"");
  upd();
  $("face").innerHTML=avatar(q.c);$("face").className="face";
  $("name").textContent=q.c.n;$("role").textContent="Your "+q.c.role;
  $("setup").textContent=q.setup+(m=="daily"?" All 6 hints are true, but each one you reveal costs 15 points.":"");$("claim").textContent=q.claim;
  $("clues").innerHTML=m=="daily"?"":q.cl.map((c,i)=>'<li data-i="'+i+'">'+c.t+"</li>").join("");G.rev=0;$("h2").classList.toggle("hide",m=="daily");
  const k=COST[m];
  $("h1").textContent=m=="daily"?"Reveal a true hint (6 left, −15)":"Hint: highlight key clue (−"+k[0]+")";$("h2").textContent="Hint: dim misleading clues (−"+k[1]+")";
  $("h1").disabled=$("h2").disabled=false;
  $("pick").classList.remove("hide");$("hints").classList.toggle("hide",m!="daily");
  $("reveal").classList.add("hide");$("next").classList.add("hide");
}
function upd(){
  $("score").textContent=G.score+" pts"+(G.streak>1?" · x"+G.streak:"");
  $("hearts").innerHTML=G.mode=="daily"?"":[0,1,2].map(i=>i<G.lives?"♥":"<i>♥</i>").join("");
}
function hint(n){
  if(G.mode=="daily"){if(G.answered||G.rev>=6)return;const c=G.q.cl[G.rev++];G.score=Math.max(0,G.score-15);$("clues").insertAdjacentHTML("beforeend","<li>Hint "+G.rev+": "+c.t+"</li>");$("h1").textContent=G.rev>=6?"All hints used":"Reveal a true hint ("+(6-G.rev)+" left, −15)";$("h1").disabled=G.rev>=6;upd();return}
  if(G.answered||G.h[n])return;G.h[n]=true;
  const c=COST[G.mode][n];G.score=Math.max(0,G.score-c);
  document.querySelectorAll("#clues li").forEach((li,i)=>{
    const k=G.q.cl[i].k;
    if(n==0&&k=="fact")li.classList.add("hl");
    if(n==1&&(k=="her"||k=="noise"))li.classList.add("dim");
  });
  $(n?"h2":"h1").disabled=true;upd();
}
function pick(v){
  if(G.answered)return;G.answered=true;G.total++;
  const q=G.q,ok=v===q.a,daily=G.mode=="daily";
  if(ok){G.right++;G.streak++;G.best=Math.max(G.best,G.streak);if(!daily)G.score+=10*q.d+Math.max(0,G.streak-1)*2}
  else{G.streak=0;G.lives--;if(daily)G.score=0}
  upd();
  $("face").classList.add(q.lie?"l":"t");$("face").innerHTML=avatar(q.c,q.lie?"l":"t");
  document.querySelectorAll("#clues li").forEach((li,i)=>{
    const k=q.cl[i].k,t={fact:"Key clue",sup:"Supports the answer",her:"Misleading",noise:"Noise"}[k];
    li.insertAdjacentHTML("beforeend",'<span class="tag '+k+'">'+t+"</span>");
  });
  ["hints","pick"].forEach(i=>$(i).classList.add("hide"));
  $("reveal").classList.remove("hide");
  $("reveal").innerHTML=(ok?'<b class="ok">Correct.</b> ':'<b class="no">Nope.</b> ')+"It was a <b>"+(q.lie?"lie":"truth")+"</b>. "+q.why;
  $("next").textContent=(daily||G.lives<1)?"See results":"Next case";
  $("next").classList.remove("hide");$("next").focus();
}
function next(){
  if(G.mode=="daily"||G.lives<1)return finish();
  G.round++;G.q=gen(Math.min(5,1+Math.floor(G.round/3)),Math.random);render();
}
function finish(){
  show("end");const d=G.mode=="daily",p=G.right/G.total;
  $("fs").textContent=G.score;$("fc").textContent=G.right+"/"+G.total;$("fb").textContent=G.best;
  $("share").classList.toggle("hide",!d);
  if(d){
    $("rank").textContent=G.score>=100?"Flawless":G.score>0?"Case closed":"Fooled this time";
    $("verdict").textContent=G.score>0?"You solved today’s daily case and kept "+G.score+" of 100 points. A fresh case drops tomorrow.":"The daily case got you. Tomorrow’s is a new one.";
    store.set("lon_daily",JSON.stringify({date:today(),score:G.score}));
  }else{
    $("rank").textContent=G.right>=15?"Human lie detector":G.right>=8?"Suspiciously sharp":G.right>=4?"Decent instincts":"Easy to fool";
    $("verdict").textContent="You survived "+G.total+" cases. Remember: facts beat vibes. Nervous people can be honest, and calm people can lie.";
    if(G.score>(+store.get("lon_best")||0))store.set("lon_best",G.score);
  }
}
$("endless").onclick=()=>start("endless");
$("dly").onclick=()=>start("daily");
$("next").onclick=next;$("menu").onclick=home;
$("h1").onclick=()=>hint(0);$("h2").onclick=()=>hint(1);
$("share").onclick=()=>{const t="Lie or Nah? Daily "+today()+": "+G.score+"/100";try{navigator.clipboard.writeText(t);$("share").textContent="Copied"}catch(e){$("share").textContent=t}};
document.querySelectorAll("#pick button").forEach(b=>b.onclick=()=>pick(+b.dataset.a));
home();
</script>
</body>
</html>
