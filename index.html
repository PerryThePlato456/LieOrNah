<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lie or Nah?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9e6ff;--ink:#1b1740;--card:#fff;--soft:#d8d3ff;--lie:#ff3d7f;--truth:#0f9d8a;--mut:#5a5680;--gold:#ffb703;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14112e;--ink:#f1efff;--card:#221d4a;--soft:#342d6b;--lie:#ff6b9d;--truth:#2fd1b9;--mut:#a7a2d4}}
:root[data-theme="dark"]{--bg:#14112e;--ink:#f1efff;--card:#221d4a;--soft:#342d6b;--lie:#ff6b9d;--truth:#2fd1b9;--mut:#a7a2d4}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;line-height:1.45;min-height:100vh}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:clamp(2.6rem,12vw,4rem);line-height:.92;margin:.1em 0 .25em;font-weight:800;letter-spacing:-.035em}
h2{font-size:1.7rem;margin:.2em 0;font-weight:800;letter-spacing:-.02em}
p{margin:.4em 0}.mut{color:var(--mut)}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 18px;font-weight:600;color:var(--ink)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.go{background:var(--ink);color:var(--bg);width:100%;margin-top:12px;font-size:1.05rem}
.daily{background:var(--gold);color:#2b1c00}
.cast{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0 4px}
.cast div{text-align:center;font-size:.72rem;font-weight:600}
.cast svg{width:100%;height:auto;border-radius:50%;background:var(--soft);display:block;margin-bottom:2px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.95rem}
.badge{background:var(--ink);color:var(--bg);border-radius:99px;padding:4px 12px;font-size:.85rem}
.badge.d{background:var(--gold);color:#2b1c00}
.hearts{letter-spacing:2px;color:var(--lie)}.hearts i{font-style:normal;opacity:.2}
.card{background:var(--card);border-radius:24px;padding:18px;margin-top:12px}
.setup{color:var(--mut);font-size:.95rem;margin:14px 0 0}
ul.clues{list-style:none;padding:0;margin:10px 0 0}
ul.clues li{border-left:4px solid var(--ink);padding:5px 0 5px 12px;margin:8px 0;transition:opacity .3s}
li.hl{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,transparent)}
li.dim{opacity:.4;text-decoration:line-through}
.tag{display:inline-block;font-size:.72rem;font-weight:800;border-radius:99px;padding:1px 8px;margin-left:6px;background:var(--soft)}
.tag.fact{background:var(--gold);color:#2b1c00}
.hints{display:flex;gap:8px;margin-top:12px}
.hints button{flex:1;background:var(--soft);font-size:.8rem;padding:10px 8px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pick button{padding:18px 8px;font-size:1.25rem;font-weight:800}
.t{background:var(--truth);color:#06251f}.l{background:var(--lie);color:#2b0013}
.reveal{margin-top:14px;padding:14px;border-radius:16px;background:var(--soft)}
.reveal b.ok{color:var(--truth)}.reveal b.no{color:var(--lie)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;text-align:center}
.stats div{background:var(--card);border-radius:16px;padding:12px;font-size:.85rem}
.stats strong{display:block;font-size:1.6rem}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#home,#end{max-width:560px;margin:0 auto}
.split{margin-top:12px}
.scene{position:relative;background:var(--soft);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:14px 14px 0;min-height:48vh}
.split .card{margin-top:12px}
@media(min-width:760px){.split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}.split .card{margin-top:0}.scene{position:sticky;top:12px;min-height:76vh}}
.tagname{position:absolute;top:14px;left:16px}
.nm{font-weight:800;font-size:1.4rem;line-height:1.1}.rl{color:var(--mut);font-size:.85rem}
.bub{position:relative;align-self:stretch;background:var(--card);border-radius:20px;padding:12px 14px;margin:56px 0 14px;font-size:1.1rem;font-weight:600;animation:pop .4s}
.bub::after{content:"";position:absolute;bottom:-9px;left:50%;border:10px solid transparent;border-bottom:0;border-top-color:var(--card)}
.char{width:min(330px,72%);margin-top:auto}.char svg{width:100%;display:block;overflow:visible}
.prop{position:absolute;right:16px;top:12px;font-size:2.8rem;animation:fl 2.4s ease-in-out infinite}
.prop.caught{animation:shk .25s 6,glow 2s forwards;filter:drop-shadow(0 0 10px var(--lie))}
.prop.safe{animation:up 1.4s forwards}
.bd{transform-origin:60px 124px;animation:br 3.6s ease-in-out infinite}.hd{transform-origin:60px 96px}
.ey,.mo,.bw,.bk{transform-box:fill-box;transform-origin:center}
.bk{animation:bl 4.5s infinite}.sw,.pf{opacity:0}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@keyframes fl{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes glow{to{transform:scale(1.4)}}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
@keyframes br{50%{transform:translateY(-2px) scale(1.012)}}
@keyframes bl{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes jit{50%{transform:translate(calc(1.5px*var(--a)),calc(-1px*var(--a)))}}
@keyframes dart{0%,100%{transform:translateX(0)}25%{transform:translateX(calc(-7px*var(--a)))}60%{transform:translateX(calc(7px*var(--a)))}80%{transform:translateX(calc(-3px*var(--a)))}}
@keyframes tk{to{transform:scaleY(calc(1 + 1.4*var(--a)))}}
@keyframes tw{0%,70%,100%{transform:none}80%{transform:translate(calc(3px*var(--a)),calc(-3px*var(--a))) rotate(calc(10deg*var(--a)))}}
@keyframes jg{to{transform:translateY(calc(-4px*var(--a)))}}
@keyframes sh{0%,100%{transform:translateY(0)}35%,65%{transform:translateY(calc(-7px*var(--a)))}}
@keyframes nd{50%{transform:translateY(calc(4px*var(--a))) rotate(calc(2deg*var(--a)))}}
@keyframes dr{0%{transform:translateY(0);opacity:var(--a)}100%{transform:translateY(14px);opacity:0}}
@keyframes pf{0%{transform:translate(0,0) scale(.5);opacity:calc(.9*var(--a))}100%{transform:translate(8px,-10px) scale(1.4);opacity:0}}
[data-t~=sweat] .hd{animation:jit .14s infinite}[data-t~=sweat] .sw{animation:dr 1s infinite}
[data-t~=dart] .ey{animation:dart 1.1s infinite}
[data-t~=talk] .mo{animation:tk .2s infinite alternate}
[data-t~=twitch] .bw{animation:tw .6s infinite}
[data-t~=jig] .bd{animation:jg .3s infinite alternate}
[data-t~=steady] .bk{animation-duration:9s}
[data-t~=shrug] .bd,[data-t~=shrug] .hd{animation:sh 1.5s infinite}
[data-t~=annoy] .bw{transform:translateY(calc(4px*var(--a)))}[data-t~=annoy] .pf{animation:pf 1.2s infinite}
[data-t~=nod] .hd{animation:nd .8s infinite}
[data-t~=tilt] .hd{transform:rotate(calc(9deg*var(--a)))}[data-t~=tilt] .bw{transform:translateY(calc(-3px*var(--a)))}
@media (prefers-reduced-motion:reduce){.bd,.bk,.prop{animation:none!important}}
.scene{background:#ddd}
.scn{position:absolute;inset:0}.scn svg{width:100%;height:100%;display:block}
.char{position:relative;--a:1}
.tagname{background:var(--card);padding:6px 12px;border-radius:14px;z-index:2}
.prop{z-index:2}
.tog{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:.9rem;font-weight:600}
.tog input{width:20px;height:20px;margin-top:2px;accent-color:var(--ink)}
.hab{background:var(--soft);border-radius:12px;padding:8px 12px;font-size:.9rem;font-weight:600}
.xtreme{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:#e11d48;color:#fff;font-weight:800;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.badge.x{background:#e11d48;color:#fff}
.tmr{height:10px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:8px}
.tmr i{display:block;height:100%;width:100%;background:#e11d48}
.adm{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);overflow:auto;padding:16px}
.admc{background:var(--card);border-radius:20px;padding:16px;max-width:520px;margin:0 auto}
.admc h3{margin:18px 0 4px}
.admc input,.admc textarea,.admc select{width:100%;font:inherit;padding:10px;border-radius:10px;border:2px solid var(--soft);background:var(--bg);color:var(--ink)}
.admc .lab{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin-top:10px}
.admc li button{padding:4px 10px;margin-left:8px;background:var(--soft)}
</style>
</head>
<body>
<main>
<section id="home">
  <h1>Lie or Nah?</h1>
  <p>Someone you know says they didn’t take your stuff. Watch their body language, count the tells, and call it. The cases never run out.</p>
  <button class="go" id="endless">Play endless</button>
  <button class="go daily" id="dly">Daily case</button>
  <label class="tog"><input type="checkbox" id="tend"><span>Tendencies (endless and extreme): every character has a habit that doesn’t count as a tell</span></label>
  <p class="mut cdp"></p>
  <p class="mut" id="best"></p>
  <div class="cast" id="cast"></div>
  <button class="xtreme" id="xbtn">Extreme mode</button>
  <p class="mut" style="font-size:.85rem">Every character and scenario is made up.</p>
</section>

<section id="play" class="hide" aria-live="polite">
  <div class="top"><span class="badge" id="lvl"></span><span class="hearts" id="hearts"></span><span id="score"></span></div>
  <div class="tmr hide" id="tmr"><i id="tbar"></i></div>
  <div class="split">
    <div class="scene">
      <div class="scn" id="scn"></div>
      <div class="tagname"><div class="nm" id="name"></div><div class="rl" id="role"></div></div>
      <div class="prop" id="prop"></div>
      <div class="bub" id="claim"></div>
      <div class="char" id="face"></div>
    </div>
    <div class="card">
      <p class="setup" id="setup"></p>
      <p class="hab hide" id="hab"></p>
      <p class="mut" id="nt" style="font-size:.85rem"></p>
      <ul class="clues" id="clues"></ul>
      <div class="hints" id="hints"><button id="h1"></button></div>
      <div class="pick" id="pick">
        <button class="t" data-a="1">Truth</button>
        <button class="l" data-a="0">Lie</button>
      </div>
      <div class="reveal hide" id="reveal"></div>
      <button class="go hide" id="next">Next</button>
    </div>
  </div>
</section>

<section id="end" class="hide">
  <h2 id="rank"></h2>
  <p id="verdict"></p>
  <div class="stats"><div><strong id="fs"></strong>points</div><div><strong id="fc"></strong>correct</div><div><strong id="fb"></strong>best streak</div></div>
  <p class="mut cdp hide" id="cde"></p>
  <button class="go daily hide" id="share">Copy result</button>
  <button class="go" id="menu">Back to menu</button>
</section>
</main>

<div class="adm hide" id="adm" role="dialog" aria-modal="true" aria-label="Admin panel">
 <div class="admc">
  <div class="top"><h2>Admin</h2><button id="ax">Close</button></div>
  <p class="mut" id="am"></p><p id="amsg" aria-live="polite" style="font-weight:600"></p>
  <h3>Daily</h3><p class="mut" id="ads"></p>
  <button class="go" id="arst">Reset today’s daily (new question, same timer)</button>
  <h3>Special scenario</h3>
  <label class="lab">Character</label><select id="ac"></select>
  <label class="lab">Item (🧴 icon list: fragrance, AirPods, phone, TV remote, Stanley cup, sneakers, hoodie, game controller, lip gloss, Labubu; anything else gets 📦)</label><input id="ai" placeholder="AirPods">
  <label class="lab">Setup (what happened)</label><textarea id="as" rows="2" placeholder="Your AirPods vanished after the group project. You ask your cousin, Zed."></textarea>
  <label class="lab">What they say</label><input id="acl" placeholder="“I swear I never saw them.”">
  <label class="lab">Answer</label><select id="av"><option value="lie">Lie</option><option value="truth">Truth</option></select>
  <label class="lab">Clues (one per line; in the daily these become the true hints)</label><textarea id="acu" rows="3"></textarea>
  <label class="lab">Tells: nervous = sweat, dart, talk, twitch, jig. Calm = steady, shrug, annoy, nod, tilt. Use + to combine, commas to separate moments</label><input id="at" placeholder="dart+twitch, nod">
  <label class="lab">Explanation after the answer (optional)</label><input id="aw">
  <button class="go" id="atest">Test it now</button>
  <button class="go" id="aadd">Add to endless pool</button>
  <button class="go daily" id="adaily">Set as today’s daily</button>
  <h3>Pool</h3><ul class="clues" id="alist"></ul>
 </div>
</div>
<script>

  const q=G.q,ok=v===q.a,daily=G.mode=="daily",xt=G.mode=="extreme";
  let left=0;if(xt){clearTimeout(G.tt);left=Math.max(0,10-(Date.now()-G.t0)/1000);const b=$("tbar"),w=getComputedStyle(b).width;b.style.transition="none";b.style.width=w}
  if(ok){G.right++;G.streak++;G.best=Math.max(G.best,G.streak);if(xt)G.score+=50+Math.round(left*3)+Math.max(0,G.streak-1)*5;else if(!daily)G.score+=10*q.d+Math.max(0,G.streak-1)*2}
  else{G.streak=0;G.lives--;if(daily)G.score=0}
  upd();clearInterval(CT);
  $("face").dataset.t="";$("face").innerHTML=avatar(q.c,q.lie?"l":"t");
  $("prop").className="prop "+(q.lie?"caught":"safe");
  document.querySelectorAll("#clues li").forEach((li,i)=>{
    const k=q.cl[i].k,t={fact:"Key clue",sup:"Real tell",her:"Misleading tell",noise:"Noise",custom:"Clue"}[k];
    li.insertAdjacentHTML("beforeend",'<span class="tag '+k+'">'+t+"</span>");
  });
  $("hints").classList.add("hide");$("pick").classList.add("hide");
  const tl=q.tells.map(x=>"<li>"+esc(x.t)+'<span class="tag '+(x.k=="sup"?"fact":"")+'">'+({sup:"Real tell",her:"Misleading",base:"Usual habit, ignore"}[x.k])+"</span></li>").join("");
  $("reveal").classList.remove("hide");
  $("reveal").innerHTML=(ok?'<b class="ok">Correct.</b> ':'<b class="no">'+(v<0?"Time’s up.":"Nope.")+"</b> ")+"It was a <b>"+(q.lie?"lie":"truth")+"</b>. "+q.why+'<ul class="clues">'+tl+"</ul>";
  $("next").textContent=(daily||G.lives<1)?"See results":"Next case";
  $("next").classList.remove("hide");$("next").focus();
}
function next(){
  if(G.mode=="daily"||G.lives<1)return finish();
  G.round++;G.q=mk(G.mode=="extreme"?5:Math.min(5,1+Math.floor(G.round/3)));render();
}
function finish(){
  show("end");clearInterval(CT);clearTimeout(G.tt);const d=G.mode=="daily",p=G.right/G.total;
  $("fs").textContent=G.score;$("fc").textContent=G.right+"/"+G.total;$("fb").textContent=G.best;
  $("share").classList.toggle("hide",!d);$("cde").classList.toggle("hide",!d);
  if(d){
    $("rank").textContent=G.score>=100?"Flawless":G.score>0?"Case closed":"Fooled this time";
    $("verdict").textContent=G.score>0?"You solved today’s daily case and kept "+G.score+" of 100 points. A fresh case drops tomorrow.":"The daily case got you. Tomorrow’s is a new one.";
    store.set("lon_daily",JSON.stringify({date:today(),score:G.score,salt:salt()}));
  }else{
    $("rank").textContent=G.mode=="extreme"?(G.right>=10?"Locked in":G.right>=5?"Quick eyes":G.right>=2?"Warming up":"Too slow"):G.right>=15?"Human lie detector":G.right>=8?"Suspiciously sharp":G.right>=4?"Decent instincts":"Easy to fool";
    $("verdict").textContent="You survived "+G.total+" cases. Remember: nervous people can be honest, and calm people can lie. Go with the pattern of tells.";
    if(G.mode=="extreme")$("verdict").textContent="You cleared "+G.right+" extreme case"+(G.right==1?"":"s")+" before it caught you. Every tell shows inside 8 seconds, so if you’re locked in there’s time to spare.";
    const bk=G.mode=="extreme"?"lon_xbest":"lon_best";if(G.score>(+store.get(bk)||0))store.set(bk,G.score);
  }
}
$("endless").onclick=()=>start("endless");$("xbtn").onclick=()=>start("extreme");
$("dly").onclick=()=>start("daily");
$("next").onclick=next;$("menu").onclick=home;
$("h1").onclick=hint;$("tend").onchange=e=>store.set("lon_tend",e.target.checked?"1":"0");
$("share").onclick=()=>{const t="Lie or Nah? Daily "+today()+": "+G.score+"/100";try{navigator.clipboard.writeText(t);$("share").textContent="Copied"}catch(e){$("share").textContent=t}};
document.querySelectorAll("#pick button").forEach(b=>b.onclick=()=>pick(+b.dataset.a));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let AS={salt:0,saltDate:"",dailyOverride:null,specials:[]},DB=null,ISO=false;
try{Object.assign(AS,JSON.parse(store.get("lon_st")||"{}"))}catch(e){}
const salt=()=>AS.saltDate===today()?AS.salt:0;
function dailyQ(){const ov=AS.dailyOverride;if(ov&&ov.date===today())return fromSpecial(ov.sc,6,{});return gen(6,rng(+today().split("-").join("")+salt()*7919))}
function mk(d){const sp=AS.specials.filter(x=>!G.o.used.has("sp"+x.id));if(sp.length&&Math.random()<.3){const sc=sp[Math.floor(Math.random()*sp.length)];G.o.used.add("sp"+sc.id);return fromSpecial(sc,d,G.o)}return gen(d,Math.random,G.o)}
function fromSpecial(sc,d,o){
  const c=CAST.find(x=>x.n==sc.c)||CAST[0],lie=!!sc.lie,hb=o&&o.tend?HAB[c.n]:null,all=[...BL,...BT],nerv=new Set(BL.map(x=>x.id));
  const mom=(sc.tells||"").split(",").map(g=>g.split("+").map(x=>x.trim()).filter(x=>all.some(a=>a.id==x))).filter(g=>g.length);
  const tells=[...new Set(mom.flat())].map(id=>({...all.find(a=>a.id==id),k:nerv.has(id)==lie?"sup":"her"}));
  if(hb)tells.push({...all.find(a=>a.id==hb),k:"base"});
  return {c,d,lie,it:sc.it||"stuff",cl:(sc.clues||"").split("\n").map(t=>t.trim()).filter(Boolean).map(t=>({t,k:"custom"})),tells,mom:mom.length?mom.flatMap(m=>[m,[]]):[[]],hb,habit:hb?c.n+" "+HB[hb]:"",a:lie?0:1,setup:sc.setup||"",claim:sc.claim||"",why:(lie?"Caught. ":"They’re honest. ")+(sc.why||"")+" (special scenario)"};
}
function msg(t){$("amsg").textContent=t}
function setST(d){Object.assign(AS,d);store.set("lon_st",JSON.stringify(AS))}
function saveST(){store.set("lon_st",JSON.stringify(AS));if(DB)DB.doc("config/state").set(AS).then(()=>msg("Saved. Signed-in players will see it.")).catch(()=>msg("Saved on this device only. Only the owner can publish changes to everyone."));else msg("Saved on this device only.")}
(async()=>{if(!window.claude)return;try{const u=await claude.use("user");ISO=u?await u.isOwner():false}catch(e){}
try{DB=await claude.use("db");if(DB)DB.doc("config/state").onSnapshot(sn=>{if(sn.exists){setST(sn.data());if(!$("home").classList.contains("hide"))home();adm()}},()=>{})}catch(e){}})();
function adm(){
  $("am").textContent=ISO?"You’re the owner, so changes publish to everyone signed in.":"Changes here reach everyone only when the owner makes them.";
  $("ads").textContent="Daily salt: "+salt()+(AS.dailyOverride&&AS.dailyOverride.date===today()?" (custom daily active)":"")+". The timer still resets at 12am ET.";
  $("alist").innerHTML=AS.specials.length?AS.specials.map(x=>"<li>"+esc(x.c)+": "+esc((x.setup||"").slice(0,50))+'<button data-d="'+x.id+'">Delete</button></li>').join(""):"<li class=\"mut\">None yet</li>";
}
function readSc(){const v=i=>$(i).value.trim(),sc={id:Date.now(),c:$("ac").value,it:v("ai")||"stuff",setup:v("as"),claim:v("acl"),lie:$("av").value=="lie",clues:$("acu").value,tells:v("at"),why:v("aw")};if(!sc.setup||!sc.claim){msg("Add a setup and what they say first.");return null}return sc}
function openAdm(){const a=$("ac");if(!a.options.length)a.innerHTML=CAST.map(c=>"<option>"+c.n+"</option>").join("");adm();msg("");$("adm").classList.remove("hide")}
$("ax").onclick=()=>$("adm").classList.add("hide");
$("arst").onclick=()=>{setST({salt:1+Math.floor(Math.random()*1e6),saltDate:today(),dailyOverride:null});saveST();adm();home()};
$("aadd").onclick=()=>{const sc=readSc();if(!sc)return;AS.specials.push(sc);saveST();adm()};
$("adaily").onclick=()=>{const sc=readSc();if(!sc)return;setST({dailyOverride:{date:today(),sc},salt:1+Math.floor(Math.random()*1e6),saltDate:today()});saveST();adm();home()};
$("atest").onclick=()=>{const sc=readSc();if(!sc)return;G={mode:"endless",lives:3,score:0,streak:0,best:0,round:0,right:0,total:0,o:{used:new Set(),tend:false}};G.q=fromSpecial(sc,3,G.o);$("adm").classList.add("hide");show("play");render()};
$("alist").onclick=e=>{const id=e.target.dataset.d;if(id){AS.specials=AS.specials.filter(x=>String(x.id)!==id);saveST();adm()}};
let kb=null,kt=0;
addEventListener("keydown",e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.key.length!=1)return;
  if(kb===null){if(e.key.toLowerCase()=="k"){kb="";kt=Date.now()}return}
  if(Date.now()-kt>10000){kb=null;return}
  kb+=e.key;if(!"Blanks".startsWith(kb)){kb=null;return}
  if(kb=="Blanks"){kb=null;openAdm()}});
addEventListener("keydown",e=>{if(e.key=="Escape")$("adm").classList.add("hide")});
const pad=n=>String(n).padStart(2,"0");
function left(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",minute:"numeric",second:"numeric",hourCycle:"h23"}).formatToParts(new Date()),g=t=>+p.find(x=>x.type==t).value;return 86400-(g("hour")*3600+g("minute")*60+g("second"))}
let DK=today();
function tick(){const t=left();document.querySelectorAll(".cdp").forEach(e=>e.textContent="Next daily case in "+pad(Math.floor(t/3600))+":"+pad(Math.floor(t%3600/60))+":"+pad(t%60)+" (resets 12am ET / 9pm PT)");if(today()!==DK){DK=today();if(!$("home").classList.contains("hide"))home()}}
tick();setInterval(tick,1000);
home();
</script>
